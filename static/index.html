<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 批改 · 错题分析 · 学情分析</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0f1117; color: #e7e9ee; line-height: 1.6; }
    header { padding: 18px 28px; background: #161b26; border-bottom: 1px solid #232a38; }
    header h1 { font-size: 20px; }
    .sub { color: #7f8aa3; font-size: 13px; margin-top: 4px; }
    .tabs { display: flex; gap: 8px; padding: 16px 28px 0; }
    .tab { padding: 8px 18px; border-radius: 8px 8px 0 0; background: #1a2130;
      cursor: pointer; color: #a7b0c5; font-size: 14px; border: 1px solid #232a38; border-bottom: none; }
    .tab.active { background: #0f1117; color: #fff; }
    main { padding: 22px 28px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { background: #151a24; border: 1px solid #232a38; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    label { font-size: 13px; color: #9aa4bb; }
    input[type=text], textarea, select { background: #0f1117; border: 1px solid #2a3346;
      color: #e7e9ee; border-radius: 8px; padding: 10px; font-size: 14px; width: 100%; }
    button { background: #3b6ef0; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .drop { border: 2px dashed #2a3346; border-radius: 10px; padding: 24px; text-align: center; color: #6b7690; }
    #thumbs img { height: 80px; border-radius: 8px; margin: 8px 8px 0 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #232a38; text-align: left; }
    th { color: #8b95ac; font-weight: 600; }
    .ok { color: #57d38c; } .bad { color: #ff6b6b; }
    .bar { height: 8px; background: #22293a; border-radius: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: #3b6ef0; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; background: #223049; color: #7aa2ff; font-size: 12px; margin: 2px; }
    h3 { font-size: 15px; margin-bottom: 10px; color: #cdd6e6; }
    .muted { color: #6b7690; font-size: 13px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>AI 批改 · 错题分析 · 学情分析系统</h1>
    <div class="sub" id="model-info">加载中…</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="grade">📸 AI 批改</div>
    <div class="tab" data-tab="errors">📕 错题本</div>
    <div class="tab" data-tab="analytics">📊 学情分析</div>
  </div>

  <main>
    <!-- 批改 -->
    <section class="panel active" id="p-grade">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h3>上传学生作业图片</h3>
          <input type="text" id="student-id" placeholder="学生ID（可选）" style="width:200px" />
        </div>
        <div class="drop" id="drop">点击选择或拖入作业图片（支持多张）
          <input type="file" id="file" accept="image/*" multiple hidden />
        </div>
        <div id="thumbs"></div>
        <div style="margin-top:12px">
          <label>参考答案 / 评分标准（可选，留空由模型自行判定）</label>
          <textarea id="reference" rows="2" placeholder="如：1.B 2.C 3.(答案略)…"></textarea>
        </div>
        <div class="row" style="margin-top:12px;justify-content:flex-end;">
          <button id="btn-grade">开始批改</button>
        </div>
      </div>
      <div id="grade-result"></div>
    </section>

    <!-- 错题本 -->
    <section class="panel" id="p-errors">
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h3>错题本明细</h3>
          <div class="row"><input type="text" id="err-student" placeholder="按学生ID筛选" style="width:200px" />
          <button id="btn-errors">刷新</button></div>
        </div>
        <div id="err-list" style="margin-top:12px"></div>
      </div>
    </section>

    <!-- 学情 -->
    <section class="panel" id="p-analytics">
      <div class="card">
        <div class="row">
          <div style="flex:1"><label>学生ID（留空=全班）</label><input type="text" id="an-student" /></div>
          <div style="flex:1"><label>学科（留空=全部）</label><input type="text" id="an-subject" placeholder="数学/物理…" /></div>
          <div style="align-self:flex-end"><button id="btn-analytics">生成学情报告</button></div>
        </div>
      </div>
      <div id="an-result"></div>
    </section>
  </main>

  <script>
    let images = [];
    const $ = id => document.getElementById(id);

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active'); $('p-' + t.dataset.tab).classList.add('active');
    });

    fetch('/api/health').then(r => r.json()).then(h => {
      $('model-info').textContent = `视觉模型 ${h.vlm_model} · 推理模型 ${h.llm_model} · ${h.llm_enabled ? '已配置密钥' : '未配置密钥（批改将跳过AI，学情统计仍可用）'}`;
    });

    const drop = $('drop'), file = $('file');
    drop.onclick = () => file.click();
    drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = '#3b6ef0'; };
    drop.ondragleave = () => drop.style.borderColor = '#2a3346';
    drop.ondrop = e => { e.preventDefault(); addFiles(e.dataTransfer.files); };
    file.onchange = () => addFiles(file.files);
    function addFiles(fs) {
      for (const f of fs) { const r = new FileReader(); r.onload = e => {
        images.push({ base64: e.target.result });
        const img = document.createElement('img'); img.src = e.target.result; $('thumbs').appendChild(img);
      }; r.readAsDataURL(f); }
    }

    $('btn-grade').onclick = async () => {
      const btn = $('btn-grade'); btn.disabled = true;
      $('grade-result').innerHTML = '<div class="card muted">批改中，请稍候…（视觉识别 + 逐题判分 + 错题归因）</div>';
      try {
        const r = await fetch('/api/grade', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ images, student_id: $('student-id').value || 'anonymous', reference: $('reference').value }) });
        const d = await r.json(); renderGrade(d);
      } catch (e) { $('grade-result').innerHTML = '<div class="card bad">请求失败：' + e + '</div>'; }
      finally { btn.disabled = false; }
    };

    function renderGrade(d) {
      let html = '';
      html += `<div class="card"><h3>执行链路</h3>${(d.steps||[]).map(s=>`<span class="pill">${s}</span>`).join('')} ${d.error?`<span class="bad">${d.error}</span>`:''}</div>`;
      const g = d.grading;
      if (g) {
        html += `<div class="card"><h3>批改结果 · ${g.subject||'未识别学科'} ${d.saved_errors?`（新增 ${d.saved_errors} 条错题）`:''}</h3>
          <div class="row"><span class="muted">得分 ${g.earned_score} / ${g.total_score}</span></div>
          <p style="margin-top:8px">${g.overall_comment||''}</p>
          <table><tr><th>题号</th><th>作答</th><th>参考答案</th><th>判定</th><th>得分</th><th>知识点</th><th>批注</th></tr>`;
        (g.questions||[]).forEach(q => { html += `<tr><td>${q.question_no}</td><td>${q.student_answer||''}</td>
          <td>${q.correct_answer||''}</td><td class="${q.is_correct?'ok':'bad'}">${q.is_correct?'✓ 对':'✗ 错'}</td>
          <td>${q.score}/${q.max_score}</td><td>${q.knowledge_point||''}</td><td>${q.feedback||''}</td></tr>`; });
        html += '</table></div>';
      }
      const ea = d.error_analysis;
      if (ea && (ea.errors||[]).length) {
        html += `<div class="card"><h3>错题归因</h3><table><tr><th>题号</th><th>错误类型</th><th>错因分析</th><th>订正建议</th></tr>`;
        ea.errors.forEach(e => html += `<tr><td>${e.question_no}</td><td><span class="pill">${e.error_type}</span></td><td>${e.cause||''}</td><td>${e.suggestion||''}</td></tr>`);
        html += `</table>${ea.summary?`<p class="muted" style="margin-top:8px">${ea.summary}</p>`:''}</div>`;
      }
      $('grade-result').innerHTML = html;
    }

    $('btn-errors').onclick = loadErrors;
    async function loadErrors() {
      const sid = $('err-student').value;
      const r = await fetch('/api/errors' + (sid ? '?student_id=' + encodeURIComponent(sid) : ''));
      const d = await r.json();
      if (!d.errors.length) { $('err-list').innerHTML = '<div class="muted">暂无错题记录</div>'; return; }
      let html = '<table><tr><th>学生</th><th>学科</th><th>题号</th><th>知识点</th><th>错误类型</th><th>错因</th><th>建议</th></tr>';
      d.errors.forEach(e => html += `<tr><td>${e.student_id}</td><td>${e.subject}</td><td>${e.question_no}</td>
        <td>${e.knowledge_point}</td><td><span class="pill">${e.error_type}</span></td><td>${e.cause||''}</td><td>${e.suggestion||''}</td></tr>`);
      $('err-list').innerHTML = html + '</table>';
    }

    $('btn-analytics').onclick = async () => {
      $('an-result').innerHTML = '<div class="card muted">分析中…</div>';
      const r = await fetch('/api/analytics', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: $('an-student').value || null, subject: $('an-subject').value || null }) });
      const rep = (await r.json()).report || {};
      let html = `<div class="card"><h3>学情总览 · ${rep.scope||''}</h3>
        <div class="row"><span class="pill">批改 ${rep.total_gradings||0} 次</span><span class="pill">错题 ${rep.total_errors||0} 道</span>
        <span class="pill">平均得分率 ${(((rep.avg_score_rate||0)*100).toFixed(1))}%</span></div>
        ${rep.narrative?`<h3 style="margin-top:16px">AI 学情洞察</h3><pre>${rep.narrative}</pre>`:''}</div>`;
      if ((rep.knowledge_mastery||[]).length) {
        html += `<div class="card"><h3>知识点掌握度</h3><table><tr><th>知识点</th><th>考查</th><th>错误</th><th style="width:40%">掌握率</th></tr>`;
        rep.knowledge_mastery.forEach(m => html += `<tr><td>${m.knowledge_point}</td><td>${m.attempts}</td><td>${m.wrong}</td>
          <td><div class="bar"><i style="width:${(m.mastery_rate*100).toFixed(0)}%"></i></div> ${(m.mastery_rate*100).toFixed(0)}%</td></tr>`);
        html += '</table></div>';
      }
      const dist = rep.error_type_dist||{};
      if (Object.keys(dist).length) {
        html += `<div class="card"><h3>错误类型分布</h3>${Object.entries(dist).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join('')}</div>`;
      }
      $('an-result').innerHTML = html;
    };
  </script>
</body>
</html>
